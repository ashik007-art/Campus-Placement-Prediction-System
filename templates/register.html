{% extends "base.html" %}

{% block title %}Student Registration - Campus Placement Prediction System{% endblock %}

{% block public_content %}
<div class="auth-wrapper" style="padding: 40px 20px;">
  <div class="auth-card" style="max-width: 600px;">
    <div class="auth-header">
      <div style="font-size: 2.2rem; color: var(--primary);">
        <i class="fa-solid fa-user-plus"></i>
      </div>
      <h1>Student Account Registration</h1>
      <p>Create your placement candidate profile</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <div class="form-grid">
        <div class="form-group">
          <label for="full_name">Full Name <span class="required">*</span></label>
          <input type="text" id="full_name" name="full_name" class="form-control" placeholder="e.g. Aditi Rao" required>
        </div>

        <div class="form-group">
          <label for="student_id_number">Student ID / Roll No <span class="required">*</span></label>
          <input type="text" id="student_id_number" name="student_id_number" class="form-control" placeholder="e.g. STU2026101" required>
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label for="email">College Email Address <span class="required">*</span></label>
          <input type="email" id="email" name="email" class="form-control" placeholder="aditi.rao@campus.edu" required>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" class="form-control" placeholder="+91 98765 00000">
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label for="department">Department <span class="required">*</span></label>
          <select id="department" name="department" class="form-control" required>
            <option value="" disabled selected>-- Select Department --</option>
            <option value="Computer Science & Engineering">Computer Science & Engineering</option>
            <option value="Information Technology">Information Technology</option>
            <option value="Electronics & Communication">Electronics & Communication</option>
            <option value="Data Science & Artificial Intelligence">Data Science & Artificial Intelligence</option>
            <option value="Mechanical Engineering">Mechanical Engineering</option>
            <option value="Electrical & Electronics">Electrical & Electronics</option>
            <option value="Civil Engineering">Civil Engineering</option>
          </select>
        </div>

        <div class="form-group">
          <label for="graduation_year">Graduation Year <span class="required">*</span></label>
          <select id="graduation_year" name="graduation_year" class="form-control" required>
            <option value="2026" selected>2026</option>
            <option value="2027">2027</option>
            <option value="2025">2025</option>
          </select>
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label for="password">Password <span class="required">*</span></label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Minimum 6 characters" required>
        </div>

        <div class="form-group">
          <label for="confirm_password">Confirm Password <span class="required">*</span></label>
          <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter password" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 11px;">
        <i class="fa-solid fa-check-circle"></i> Complete Registration
      </button>
    </form>

    <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-color); text-align: center; font-size: 0.85rem; color: var(--text-muted);">
      Already have an account? <a href="{{ url_for('auth.login') }}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign in here</a>
    </div>
  </div>
</div>
{% endblock %}
