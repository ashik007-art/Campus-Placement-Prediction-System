{% extends "base.html" %}

{% block title %}Add New Student - PlacementHub{% endblock %}
{% block page_heading %}Register Candidate Profile{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px; margin: 0 auto;">
  <div class="card-header">
    <h2 class="card-title"><i class="fa-solid fa-user-plus" style="color: var(--primary); margin-right: 8px;"></i> Student Candidate Details</h2>
    <a href="{{ url_for('students.list_students') }}" class="btn btn-secondary btn-sm">Cancel</a>
  </div>
  <div class="card-body">
    <form method="POST" action="{{ url_for('students.add_student') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <div class="nav-section-title" style="padding-left: 0;">1. Personal &amp; Account Information</div>
      <div class="form-grid">
        <div class="form-group">
          <label for="full_name">Full Name <span class="required">*</span></label>
          <input type="text" id="full_name" name="full_name" class="form-control" placeholder="Candidate full name" required>
        </div>

        <div class="form-group">
          <label for="student_id_number">Student ID / Roll No <span class="required">*</span></label>
          <input type="text" id="student_id_number" name="student_id_number" class="form-control" placeholder="e.g. STU2026105" required>
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label for="email">Institutional Email <span class="required">*</span></label>
          <input type="email" id="email" name="email" class="form-control" placeholder="candidate@campus.edu" required>
        </div>

        <div class="form-group">
          <label for="phone">Contact Phone</label>
          <input type="tel" id="phone" name="phone" class="form-control" placeholder="+91 98765 00000">
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label for="password">Initial Password <span class="required">*</span></label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Minimum 6 characters" required>
        </div>

        <div class="form-group">
          <label for="department">Department <span class="required">*</span></label>
          <select id="department" name="department" class="form-control" required>
            <option value="" disabled selected>-- Select Department --</option>
            <option value="Computer Science & Engineering">Computer Science & Engineering</option>
            <option value="Information Technology">Information Technology</option>
            <option value="Electronics & Communication">Electronics & Communication</option>
            <option value="Data Science & Artificial Intelligence">Data Science & Artificial Intelligence</option>
            <option value="Mechanical Engineering">Mechanical Engineering</option>
            <option value="Civil Engineering">Civil Engineering</option>
          </select>
        </div>
      </div>

      <div class="nav-section-title" style="padding-left: 0; margin-top: 10px;">2. Academic Performance Metrics</div>
      <div class="form-grid">
        <div class="form-group">
          <label for="graduation_year">Graduation Year <span class="required">*</span></label>
          <select id="graduation_year" name="graduation_year" class="form-control" required>
            <option value="2026" selected>2026</option>
            <option value="2027">2027</option>
            <option value="2025">2025</option>
          </select>
        </div>

        <div class="form-group">
          <label for="cgpa">UG Cumulative CGPA (0 - 10) <span class="required">*</span></label>
          <input type="number" step="0.01" min="0" max="10" id="cgpa" name="cgpa" class="form-control" value="7.50" required>
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label for="tenth_percentage">10th Board Percentage (%) <span class="required">*</span></label>
          <input type="number" step="0.1" min="0" max="100" id="tenth_percentage" name="tenth_percentage" class="form-control" value="80.0" required>
        </div>

        <div class="form-group">
          <label for="twelfth_percentage">12th / Diploma Percentage (%) <span class="required">*</span></label>
          <input type="number" step="0.1" min="0" max="100" id="twelfth_percentage" name="twelfth_percentage" class="form-control" value="78.0" required>
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label for="backlogs">Active Backlogs Count <span class="required">*</span></label>
          <input type="number" min="0" id="backlogs" name="backlogs" class="form-control" value="0" required>
        </div>

        <div class="form-group">
          <label for="attendance_percentage">Attendance Percentage (%) <span class="required">*</span></label>
          <input type="number" step="0.1" min="0" max="100" id="attendance_percentage" name="attendance_percentage" class="form-control" value="85.0" required>
        </div>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
        <a href="{{ url_for('students.list_students') }}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">
          <i class="fa-solid fa-save"></i> Save Candidate Record
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
