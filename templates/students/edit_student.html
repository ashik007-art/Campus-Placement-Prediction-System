{% extends "base.html" %}

{% block title %}Edit Student - {{ student.full_name }}{% endblock %}
{% block page_heading %}Edit Student Information{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px; margin: 0 auto;">
  <div class="card-header">
    <h2 class="card-title"><i class="fa-solid fa-pen-to-square" style="color: var(--primary); margin-right: 8px;"></i> Update Candidate Information</h2>
    <a href="{{ url_for('students.view_student', student_id=student.id) }}" class="btn btn-secondary btn-sm">Cancel</a>
  </div>
  <div class="card-body">
    <form method="POST" action="{{ url_for('students.edit_student', student_id=student.id) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <div class="nav-section-title" style="padding-left: 0;">1. Personal Details</div>
      <div class="form-grid">
        <div class="form-group">
          <label for="full_name">Full Name <span class="required">*</span></label>
          <input type="text" id="full_name" name="full_name" class="form-control" value="{{ student.full_name }}" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address <span class="required">*</span></label>
          <input type="email" id="email" name="email" class="form-control" value="{{ student.email }}" required>
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label for="department">Department <span class="required">*</span></label>
          <select id="department" name="department" class="form-control" required>
            <option value="Computer Science & Engineering" {% if student.department == 'Computer Science & Engineering' %}selected{% endif %}>Computer Science & Engineering</option>
            <option value="Information Technology" {% if student.department == 'Information Technology' %}selected{% endif %}>Information Technology</option>
            <option value="Electronics & Communication" {% if student.department == 'Electronics & Communication' %}selected{% endif %}>Electronics & Communication</option>
            <option value="Data Science & Artificial Intelligence" {% if student.department == 'Data Science & Artificial Intelligence' %}selected{% endif %}>Data Science & Artificial Intelligence</option>
            <option value="Mechanical Engineering" {% if student.department == 'Mechanical Engineering' %}selected{% endif %}>Mechanical Engineering</option>
            <option value="Civil Engineering" {% if student.department == 'Civil Engineering' %}selected{% endif %}>Civil Engineering</option>
          </select>
        </div>

        <div class="form-group">
          <label for="graduation_year">Graduation Year <span class="required">*</span></label>
          <select id="graduation_year" name="graduation_year" class="form-control" required>
            <option value="2026" {% if student.graduation_year == 2026 %}selected{% endif %}>2026</option>
            <option value="2027" {% if student.graduation_year == 2027 %}selected{% endif %}>2027</option>
            <option value="2025" {% if student.graduation_year == 2025 %}selected{% endif %}>2025</option>
          </select>
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" class="form-control" value="{{ student.phone or '' }}">
        </div>

        <div class="form-group">
          <label for="resume_url">Resume / Portfolio URL</label>
          <input type="url" id="resume_url" name="resume_url" class="form-control" value="{{ student.resume_url or '' }}" placeholder="https://drive.google.com/...">
        </div>
      </div>

      <div class="nav-section-title" style="padding-left: 0; margin-top: 10px;">2. Academic Details &amp; Evaluation</div>
      <div class="form-grid">
        <div class="form-group">
          <label for="cgpa">UG CGPA (0.0 to 10.0) <span class="required">*</span></label>
          <input type="number" step="0.01" min="0" max="10" id="cgpa" name="cgpa" class="form-control" value="{{ student.cgpa }}" required>
        </div>

        <div class="form-group">
          <label for="backlogs">Active Backlogs <span class="required">*</span></label>
          <input type="number" min="0" id="backlogs" name="backlogs" class="form-control" value="{{ student.backlogs }}" required>
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label for="tenth_percentage">10th Percentage (%) <span class="required">*</span></label>
          <input type="number" step="0.1" min="0" max="100" id="tenth_percentage" name="tenth_percentage" class="form-control" value="{{ student.tenth_percentage }}" required>
        </div>

        <div class="form-group">
          <label for="twelfth_percentage">12th Percentage (%) <span class="required">*</span></label>
          <input type="number" step="0.1" min="0" max="100" id="twelfth_percentage" name="twelfth_percentage" class="form-control" value="{{ student.twelfth_percentage }}" required>
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label for="attendance_percentage">Attendance Percentage (%) <span class="required">*</span></label>
          <input type="number" step="0.1" min="0" max="100" id="attendance_percentage" name="attendance_percentage" class="form-control" value="{{ student.attendance_percentage }}" required>
        </div>

        <div class="form-group">
          <label for="communication_level">Communication Proficiency <span class="required">*</span></label>
          <select id="communication_level" name="communication_level" class="form-control" required>
            <option value="Beginner" {% if student.communication_level == 'Beginner' %}selected{% endif %}>Beginner</option>
            <option value="Intermediate" {% if student.communication_level == 'Intermediate' %}selected{% endif %}>Intermediate</option>
            <option value="Advanced" {% if student.communication_level == 'Advanced' %}selected{% endif %}>Advanced</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="aptitude_level">Aptitude &amp; Problem Solving Level <span class="required">*</span></label>
        <select id="aptitude_level" name="aptitude_level" class="form-control" required>
          <option value="Beginner" {% if student.aptitude_level == 'Beginner' %}selected{% endif %}>Beginner</option>
          <option value="Intermediate" {% if student.aptitude_level == 'Intermediate' %}selected{% endif %}>Intermediate</option>
          <option value="Advanced" {% if student.aptitude_level == 'Advanced' %}selected{% endif %}>Advanced</option>
        </select>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
        <a href="{{ url_for('students.view_student', student_id=student.id) }}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">
          <i class="fa-solid fa-save"></i> Update Profile
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
